name: "email-management-agent"
description: "AI-powered productivity agent"

llm:
  provider: "anthropic"
  model: "claude-3-5-sonnet-latest"
  temperature: 0.2
  max_tokens: 4096

mcp_servers:
  filesystem:
    command: "npx"
    args: ["@modelcontextprotocol/server-filesystem", "/tmp/email_management_agent"]
    env: {}
  
  brave_search:
    command: "npx"
    args: ["@modelcontextprotocol/server-brave-search"]
    env: {}

agent:
  name: "Email Management Agent"
  description: "Comprehensive productivity management"

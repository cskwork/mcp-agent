$schema: ../../schema/mcp-agent.config.schema.json

execution_engine: asyncio
logger:
  transports: [console, file]
  level: debug
  show_progress: true
  path_settings:
    path_pattern: "logs/legal-analysis-{unique_id}.jsonl"
    unique_id: "timestamp"
    timestamp_format: "%Y%m%d_%H%M%S"

mcp:
  servers:
    fetch:
      command: "uvx"
      args: ["mcp-server-fetch"]
    filesystem:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem"]
    postgres:
      command: "uvx"
      args: ["mcp-server-postgres", "--connection-string"]
      env:
        DATABASE_URL: "postgresql://legal_user:password@localhost:5432/legal_documents_db"
    legal_research:
      command: "uvx"
      args: ["mcp-server-legal-research"]
    document_parser:
      command: "uvx"
      args: ["mcp-server-document-parser"]
    case_law:
      command: "uvx"
      args: ["mcp-server-case-law"]
    regulatory:
      command: "uvx"
      args: ["mcp-server-regulatory-data"]
    
anthropic:
  default_model: "claude-3-5-sonnet-20241022"